server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location ~* \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    # arquivos em /assets/ têm hash de conteúdo no nome (gerado pelo Vite) — mudam de nome a
    # cada rebuild, então podem ser cacheados de forma agressiva pelo navegador sem risco.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html não tem hash no nome, então precisa ser revalidado sempre — senão o navegador
    # pode continuar servindo uma versão antiga que referencia chunks já removidos de /assets/
    # num deploy seguinte (import() dinâmico falha silenciosamente, ex: cartão CNPJ não preenche nada).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
